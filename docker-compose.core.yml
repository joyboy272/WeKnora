# Core deployment: WeKnora backend, DocReader, PostgreSQL and Redis.
# Prepare .env first (cp .env.example .env) and set DB/Redis credentials.
services:
  app:
    image: wechatopenai/weknora-app:${WEKNORA_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        APK_MIRROR_ARG: ${APK_MIRROR_ARG:-}
        WITH_ANYDOC: "0"
        WITH_BROWSERSKILL: "0"
        WITH_MYSQL_CLIENT: "0"
        BROWSERSKILL_BINARY: ""
        BROWSERSKILL_EXTENSION_PATH: ""
    container_name: WeKnora-app
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      GIN_MODE: ${GIN_MODE:-release}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      RETRIEVE_DRIVER: ${RETRIEVE_DRIVER:-postgres}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      DOCREADER_ADDR: docreader:50051
      DOCREADER_TRANSPORT: grpc
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    volumes:
      - data-files:/data/files
      - docreader-tmp:/tmp/docreader:ro
      - ./config/config.yaml:/app/config/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      docreader:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [weknora-core]
    restart: unless-stopped

  docreader:
    image: wechatopenai/weknora-docreader:${WEKNORA_VERSION:-latest}
    container_name: WeKnora-docreader
    expose: ["50051"]
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      DOCREADER_GRPC_PORT: 50051
      DOCREADER_GRPC_MAX_WORKERS: ${DOCREADER_GRPC_MAX_WORKERS:-1}
      DOCREADER_GRPC_MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      DOCREADER_PDF_RENDER_MAX_WORKERS: ${DOCREADER_PDF_RENDER_MAX_WORKERS:-1}
      DOCREADER_PDF_RENDER_PARALLELISM: ${DOCREADER_PDF_RENDER_PARALLELISM:-1}
      DOCREADER_MARKITDOWN_MAX_WORKERS: ${DOCREADER_MARKITDOWN_MAX_WORKERS:-1}
      DOCREADER_ODL_HYBRID: "off"
    volumes:
      - docreader-tmp:/tmp/docreader
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [weknora-core]
    restart: unless-stopped

  postgres:
    image: paradedb/paradedb:v0.25.11-pg17
    container_name: WeKnora-postgres
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [weknora-core]
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    container_name: WeKnora-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    networks: [weknora-core]
    restart: unless-stopped

networks:
  weknora-core:

volumes:
  postgres-data:
  redis-data:
  data-files:
  docreader-tmp:
